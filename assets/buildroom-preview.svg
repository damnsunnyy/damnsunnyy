<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Shubham Meghani — selected projects in orbit</title>
  <desc id="desc">An animated dark violet and mint project map linking selected work across applied machine learning, local AI, full-stack software, and developer tools. Click the banner to open the portfolio.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0e17"/><stop offset=".56" stop-color="#101423"/><stop offset="1" stop-color="#111b25"/></linearGradient>
    <linearGradient id="panel" x2=".9" y2="1"><stop stop-color="#1a2131"/><stop offset="1" stop-color="#0c111b"/></linearGradient>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#9af3d8"/><stop offset="1" stop-color="#56cdbb"/></linearGradient>
    <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#c4b1ff"/><stop offset="1" stop-color="#8c70e8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9678f5" stop-opacity=".24"/><stop offset="1" stop-color="#9678f5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#c2b5ff" stroke-opacity=".055"/></pattern>
    <filter id="shadow" x="-.3" y="-.35" width="1.7" height="1.8"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="1440" height="500" rx="18" fill="url(#bg)"/>
  <rect width="1440" height="500" rx="18" fill="url(#grid)"/>
  <ellipse cx="1080" cy="248" rx="390" ry="290" fill="url(#glow)"/>
  <path d="M28 76V28h48M1364 28h48v48M28 424v48h48m1288-48v48h-48" fill="none" stroke="#a78bfa" stroke-opacity=".48" stroke-width="2"/>
  <g fill="#c8d2e4" opacity=".75">
    <circle cx="672" cy="98" r="1.5"/><circle cx="708" cy="386" r="1"/><circle cx="141" cy="410" r="1.5"/><circle cx="612" cy="293" r="1"/>
    <circle cx="1381" cy="156" r="1.5"/><circle cx="556" cy="74" r="1"/><circle cx="752" cy="435" r="1"/><circle cx="378" cy="422" r="1"/>
  </g>

  <g font-family="monospace">
    <circle cx="72" cy="65" r="4" fill="#85e7d0"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" repeatCount="indefinite"/></circle>
    <text x="88" y="69" fill="#bac5d8" font-size="11" letter-spacing="2.1">SHUBHAM MEGHANI <tspan fill="#59677c">/</tspan> SOFTWARE · DATA · AI</text>
  </g>

  <g font-family="Arial,sans-serif">
    <text x="72" y="162" fill="#f1f3fa" font-size="58" font-weight="700" letter-spacing="-2.9">BUILD ACROSS.</text>
    <text x="72" y="222" fill="#b7a1ff" font-size="58" font-weight="700" letter-spacing="-2.9">MAKE IT CONNECT.</text>
    <text x="76" y="266" fill="#a4b0c4" font-family="monospace" font-size="11" letter-spacing="1.2">FULL-STACK · APPLIED ML · LOCAL AI · DEVELOPER TOOLS</text>
  </g>
  <g transform="translate(76 309)" font-family="monospace">
    <rect width="258" height="56" rx="8" fill="#161d2a" stroke="#9a83ef" stroke-opacity=".46"/>
    <circle cx="25" cy="28" r="13" fill="#85e7d015" stroke="#85e7d055"/>
    <path d="M19 28h12M25 22v12" stroke="#85e7d0" stroke-width="1.2"/>
    <text x="49" y="25" fill="#d6deeb" font-size="9" letter-spacing="1">SELECTED WORK</text>
    <text x="49" y="43" fill="#f4f2ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">10 builds · 4 fields</text>
  </g>
  <text x="76" y="405" fill="#8390a5" font-family="monospace" font-size="9" letter-spacing="1.2">MANY DIRECTIONS · ONE CRAFT</text>
  <text x="76" y="440" fill="#5f6e83" font-family="monospace" font-size="8" letter-spacing="1.4">PORTFOLIO · SELECTED WORK · LIVE BUILDS</text>

  <!-- dimensional project map -->
  <g fill="none">
    <ellipse cx="1060" cy="244" rx="353" ry="146" stroke="#a78bfa" stroke-opacity=".28" transform="rotate(-17 1060 244)"/>
    <ellipse cx="1060" cy="244" rx="315" ry="190" stroke="#72d8d0" stroke-opacity=".18" transform="rotate(21 1060 244)"/>
    <path d="M743 242C836 125 1221 120 1375 242" stroke="#85e7d0" stroke-opacity=".35" stroke-dasharray="3 8"/>
    <path d="M743 242C842 362 1225 368 1375 242" stroke="#b7a1ff" stroke-opacity=".3" stroke-dasharray="3 8"/>
  </g>
  <circle r="4" fill="#85e7d0" filter="url(#soft)"><animateMotion dur="16s" repeatCount="indefinite" path="M743 242C836 125 1221 120 1375 242"/></circle>
  <circle r="3" fill="#a78bfa"><animateMotion dur="21s" repeatCount="indefinite" path="M743 242C842 362 1225 368 1375 242"/></circle>

  <g filter="url(#shadow)">
    <rect x="770" y="86" width="590" height="317" rx="12" fill="url(#panel)" stroke="#b09aff" stroke-opacity=".72" stroke-width="1.4"/>
    <path d="M782 87h566a12 12 0 0 1 12 12v34H770V99a12 12 0 0 1 12-12" fill="#171d2b"/>
    <circle cx="792" cy="108" r="4" fill="#ff7388"/><circle cx="807" cy="108" r="4" fill="#efc46e"/><circle cx="822" cy="108" r="4" fill="#70dfb6"/>
    <text x="841" y="112" fill="#c7d1e2" font-family="monospace" font-size="8" letter-spacing="1.1">SELECTED PROJECTS <tspan fill="#85e7d0">/ 2026</tspan></text>
    <rect x="1281" y="100" width="61" height="18" rx="9" fill="#85e7d014" stroke="#85e7d044"/>
    <circle cx="1293" cy="109" r="3" fill="#85e7d0"><animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/></circle>
    <text x="1302" y="112" fill="#9be9d5" font-family="monospace" font-size="7" letter-spacing=".5">LIVE</text>
    <text x="808" y="166" fill="#8492a8" font-family="monospace" font-size="8" letter-spacing="1.4">A FEW DIRECTIONS FROM THE WORK</text>

    <g font-family="monospace">
      <rect x="808" y="188" width="247" height="77" rx="7" fill="#141c29" stroke="#85e7d055"/>
      <circle cx="833" cy="226" r="13" fill="#85e7d018"/><text x="825" y="229" fill="#85e7d0" font-size="7">01</text>
      <text x="856" y="220" fill="#f0f2fa" font-size="10" letter-spacing=".7">MODELBENCH</text><text x="856" y="238" fill="#94a2b7" font-size="8">APPLIED MACHINE LEARNING</text>
      <path d="M1031 226h13m-4-4 4 4-4 4" fill="none" stroke="#85e7d0"/>

      <rect x="1074" y="188" width="247" height="77" rx="7" fill="#141c29" stroke="#b7a1ff55"/>
      <circle cx="1099" cy="226" r="13" fill="#b7a1ff18"/><text x="1091" y="229" fill="#b7a1ff" font-size="7">02</text>
      <text x="1122" y="220" fill="#f0f2fa" font-size="10" letter-spacing=".7">SANA / ECHO</text><text x="1122" y="238" fill="#94a2b7" font-size="8">LOCAL AI · VOICE SYSTEMS</text>
      <path d="M1297 226h13m-4-4 4 4-4 4" fill="none" stroke="#b7a1ff"/>

      <rect x="808" y="282" width="247" height="77" rx="7" fill="#141c29" stroke="#f0c36c55"/>
      <circle cx="833" cy="320" r="13" fill="#f0c36c18"/><text x="825" y="323" fill="#f0c36c" font-size="7">03</text>
      <text x="856" y="314" fill="#f0f2fa" font-size="10" letter-spacing=".7">DOCSFLOW</text><text x="856" y="332" fill="#94a2b7" font-size="8">FULL-STACK COLLABORATION</text>
      <path d="M1031 320h13m-4-4 4 4-4 4" fill="none" stroke="#f0c36c"/>

      <rect x="1074" y="282" width="247" height="77" rx="7" fill="#141c29" stroke="#82c8ff55"/>
      <circle cx="1099" cy="320" r="13" fill="#82c8ff18"/><text x="1091" y="323" fill="#82c8ff" font-size="7">04</text>
      <text x="1122" y="314" fill="#f0f2fa" font-size="10" letter-spacing=".7">SITESENTRY</text><text x="1122" y="332" fill="#94a2b7" font-size="8">DEVELOPER TOOLS · AUDITS</text>
      <path d="M1297 320h13m-4-4 4 4-4 4" fill="none" stroke="#82c8ff"/>
    </g>
    <text x="808" y="383" fill="#8492a8" font-family="monospace" font-size="7" letter-spacing="1.2">FULL-STACK <tspan fill="#a78bfa">/</tspan> APPLIED ML <tspan fill="#85e7d0">/</tspan> LOCAL AI <tspan fill="#f0c36c">/</tspan> DEVELOPER TOOLS</text>
  </g>
  <g font-family="monospace" font-size="8" letter-spacing=".7">
    <rect x="824" y="426" width="248" height="38" rx="8" fill="#131a27" stroke="#85e7d05c"/>
    <circle cx="843" cy="445" r="8" fill="#85e7d019"/><text x="840" y="448" fill="#85e7d0" font-size="7">01</text>
    <text x="859" y="443" fill="#e7edf7">IDEAS</text><text x="859" y="455" fill="#8593a9" font-size="6">start with a clear problem</text>
    <path d="M1082 445h36" stroke="#728097" stroke-dasharray="3 4"/><path d="m1115 441 5 4-5 4" fill="none" stroke="#85e7d0"/>
    <rect x="1130" y="426" width="248" height="38" rx="8" fill="#131a27" stroke="#a78bfa66"/>
    <circle cx="1149" cy="445" r="8" fill="#a78bfa1c"/><text x="1146" y="448" fill="#b7a1ff" font-size="7">02</text>
    <text x="1165" y="443" fill="#e7edf7">SYSTEMS</text><text x="1165" y="455" fill="#8593a9" font-size="6">make the parts work together</text>
  </g>
</svg>
